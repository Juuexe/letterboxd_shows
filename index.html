<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121715" />
    <meta name="description" content="Track all things TV." />
    <title>Serializd — Track all things TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Serializd home"><span class="brand-mark">s</span><span>serializd</span></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#home" data-page="home">Home</a><a href="#discover" data-page="discover">Discover</a><a href="#reviews" data-page="reviews">Reviews</a><a href="#lists" data-page="lists">Lists</a>
      </nav>
      <button class="search-trigger" id="search-trigger"><span>⌕</span> Search shows, users, lists <kbd>/</kbd></button>
      <button class="avatar" id="profile-trigger" aria-label="Your profile">A</button>
    </header>
    <main class="shell">
      <div class="page-grid">
        <section id="main-content" class="main-content" aria-live="polite"></section>
        <aside class="right-rail" id="right-rail"></aside>
      </div>
      <footer><a class="brand footer-brand" href="#home"><span class="brand-mark">s</span><span>serializd</span></a><span>Made for fans of TV... all of it.</span><span>Unofficial fan-made project</span></footer>
    </main>
    <dialog id="log-dialog" class="dialog">
      <form id="log-form">
        <div class="dialog-header"><div><p class="eyebrow">Add to your diary</p><h2 id="log-title">Log an episode</h2></div><button type="button" class="close-button" data-close-dialog aria-label="Close">×</button></div>
        <p id="log-subtitle" class="dialog-subtitle"></p>
        <input id="log-key" type="hidden" />
        <fieldset class="rating-field"><legend>Your rating</legend><div id="star-picker" class="star-picker" role="radiogroup" aria-label="Rating out of five"></div><p id="rating-hint" class="rating-hint">Tap a star to rate</p></fieldset>
        <label class="field-label" for="log-review">Review <span>OPTIONAL</span></label>
        <textarea id="log-review" maxlength="700" placeholder="What did you think?" rows="4"></textarea>
        <div class="form-row"><label class="field-label" for="log-date">Watched on</label><input type="date" id="log-date" /></div>
        <label class="check-row"><input type="checkbox" id="log-spoiler" /><span>Contains spoilers</span></label>
        <div class="dialog-actions"><button type="button" class="button secondary" data-close-dialog>Cancel</button><button class="button primary" id="save-log" disabled>Save to diary</button></div>
      </form>
    </dialog>
    <dialog id="list-dialog" class="dialog small-dialog">
      <form id="list-form"><div class="dialog-header"><div><p class="eyebrow">Make a collection</p><h2>Create a list</h2></div><button type="button" class="close-button" data-close-dialog aria-label="Close">×</button></div><label class="field-label" for="list-name">List name</label><input id="list-name" class="text-input" maxlength="60" placeholder="Shows for a rainy day" required /><label class="field-label" for="list-description">Description <span>OPTIONAL</span></label><textarea id="list-description" rows="3" maxlength="180" placeholder="What's this list about?"></textarea><div class="dialog-actions"><button type="button" class="button secondary" data-close-dialog>Cancel</button><button class="button primary">Create list</button></div></form>
    </dialog>
    <dialog id="search-dialog" class="dialog search-dialog"><div class="search-modal"><div class="search-modal-input"><span>⌕</span><input id="search-input" placeholder="Search shows, users, lists…" autocomplete="off" /><button class="close-button" data-close-dialog aria-label="Close">×</button></div><div id="search-results" class="search-results"><p class="muted">Search the show catalogue.</p></div></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
